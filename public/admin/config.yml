# NRIO Lab 後台設定（Sveltia CMS）
# 每次在後台按「儲存」都會 commit 到 GitHub，GitHub Actions 會自動重新建置網站（約 1–2 分鐘）。
backend:
  name: github
  repo: Adakuo616/NRIOLab
  branch: main

# 上傳的圖片存放位置
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: news
    label: 最新消息
    label_singular: 消息
    folder: src/content/news
    extension: md
    format: frontmatter
    create: true
    identifier_field: title_zh
    slug:
      template: "{{year}}-{{month}}-{{day}}-{{fields.title_zh}}"
      editable: [create]
    summary: "{{date}}【{{category}}】{{title_zh}}"
    sortable_fields: [date, title_zh]
    fields:
      - { name: title_zh, label: 標題（中文） }
      - { name: title_en, label: 標題（英文，可留空）, required: false }
      - { name: date, label: 日期, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: category, label: 分類, widget: select, options: [研討會, 賀！, 公告, 活動, 演講, 招生, 其他], default: 研討會, hint: "研討會＝橘色、賀！＝紅色" }
      - { name: pinned, label: 置頂, widget: boolean, default: false }
      - { name: image, label: 圖片, widget: image, required: false }
      - { name: link, label: 外部連結, required: false }
      - { name: body, label: 內容（中文）, widget: markdown, required: false }
      - { name: body_en, label: 內容（英文，可留空）, widget: markdown, required: false }

  - name: pages
    label: 頁面內容
    files:
      - name: professor
        label: 指導教授
        file: src/data/professor.json
        fields:
          - { name: name_zh, label: 姓名（中文） }
          - { name: name_en, label: 姓名（英文）, required: false }
          - { name: title_zh, label: 職稱（中文） }
          - { name: title_en, label: 職稱（英文）, required: false }
          - { name: department_zh, label: 系所（中文）, required: false }
          - { name: department_en, label: 系所（英文）, required: false }
          - { name: photo, label: 照片, widget: image, required: false }
          - { name: email, label: 電子信箱, required: false }
          - { name: phone, label: 聯絡電話, required: false }
          - { name: office_zh, label: 個人辦公室（中文）, required: false }
          - { name: office_en, label: 個人辦公室（英文）, required: false }
          - { name: bio_zh, label: 簡介（中文）, widget: markdown, required: false }
          - { name: bio_en, label: 簡介（英文）, widget: markdown, required: false }
          - name: sections
            label: 其他段落
            label_singular: 段落
            widget: list
            required: false
            hint: "例如：學歷、經歷、學術服務、個人榮譽。有日期的項目請寫成「- **2026.08-迄今**　內容」，會顯示成時間軸"
            summary: "{{fields.heading_zh}}"
            fields:
              - { name: heading_zh, label: 標題（中文） }
              - { name: heading_en, label: 標題（英文）, required: false }
              - { name: content_zh, label: 內容（中文）, widget: markdown }
              - { name: content_en, label: 內容（英文）, widget: markdown, required: false }

      - name: members
        label: 研究團隊
        file: src/data/members.json
        fields:
          - name: items
            label: 成員列表
            label_singular: 成員
            widget: list
            summary: "{{fields.name_zh}}｜{{fields.title_zh}}｜{{fields.year}}"
            fields:
              - { name: name_zh, label: 姓名（中文） }
              - { name: name_en, label: 姓名（英文）, required: false }
              - { name: slug, label: 個人頁網址代稱, hint: "英文小寫與連字號，例如 wen-hui-kuo（網址會是 /members/wen-hui-kuo/）。設定後請勿更改" }
              - name: role
                label: 身分（決定分組）
                widget: select
                default: master
                options:
                  - { label: 指導教授, value: pi }
                  - { label: 博士後研究員, value: postdoc }
                  - { label: 博士生, value: phd }
                  - { label: 碩士生, value: master }
                  - { label: 大學部專題生, value: undergrad }
                  - { label: 研究助理, value: assistant }
                  - { label: 畢業校友, value: alumni }
              - { name: title_zh, label: 職稱／班別（中文）, required: false, hint: "例如：博士班、碩士班" }
              - { name: title_en, label: 職稱／班別（英文）, required: false }
              - { name: year, label: 入學學年度, required: false, hint: "例如：115學年度（同組會依此分段）" }
              - { name: email, label: Email, required: false }
              - { name: photo, label: 照片, widget: image, required: false }
              - { name: research_zh, label: 研究方向, widget: text, required: false, hint: "一行一項" }
              - { name: research_en, label: 研究方向（英文版，可留空）, widget: text, required: false }
              - { name: journal, label: 期刊論文 Journal, widget: markdown, required: false, hint: "每篇一行，以 1. 2. 編號" }
              - { name: conference, label: 研討會論文 Publish, widget: markdown, required: false, hint: "每篇一行，以 1. 2. 編號" }
              - { name: thesis, label: 碩士論文 Thesis, widget: markdown, required: false }
              - { name: awards, label: 獲獎 Award, widget: markdown, required: false, hint: "每項一行，以 - 開頭" }

      - name: life
        label: 生活點滴
        file: src/data/life.json
        fields:
          - name: items
            label: 活動列表
            label_singular: 活動
            widget: list
            add_to_top: true
            summary: "{{fields.date}}｜{{fields.title_zh}}"
            fields:
              - { name: date, label: 日期, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { name: title_zh, label: 標題（中文） }
              - { name: title_en, label: 標題（英文）, required: false }
              - { name: description_zh, label: 說明（中文）, widget: markdown, required: false }
              - { name: description_en, label: 說明（英文）, widget: markdown, required: false }
              - { name: images, label: 照片（可多張）, widget: image, multiple: true, required: false }

      - name: achievements
        label: 過往成果
        file: src/data/publications.json
        fields:
          - name: items
            label: 成果列表
            label_singular: 成果
            widget: list
            add_to_top: true
            summary: "{{fields.year}}｜{{fields.title}}"
            fields:
              - { name: year, label: 年份, widget: number, value_type: int }
              - name: type
                label: 類型
                widget: select
                default: conference
                options:
                  - { label: 獲獎, value: award }
                  - { label: 期刊論文, value: journal }
                  - { label: 研討會論文, value: conference }
                  - { label: 研究計畫, value: project }
                  - { label: 專利, value: patent }
                  - { label: 專書／章節, value: book }
                  - { label: 其他, value: other }
              - { name: title, label: 題目／名稱 }
              - { name: authors, label: 作者／成員, required: false }
              - { name: venue, label: 期刊／會議／單位, required: false }
              - { name: link, label: 連結（DOI 等）, required: false }

      - name: projects
        label: 計畫一覽（顯示在過往成果頁）
        file: src/data/projects.json
        fields:
          - name: items
            label: 計畫列表
            label_singular: 計畫
            widget: list
            add_to_top: true
            summary: "{{fields.year}}｜{{fields.title}}"
            fields:
              - { name: year, label: 年份（用於篩選按鈕）, widget: number, value_type: int }
              - { name: title, label: 計畫名稱 }
              - { name: role, label: 擔任角色, required: false, hint: "例如：計畫主持人、共同主持人" }
              - { name: period, label: 執行期間, required: false, hint: "例如：2026.03 – 2026.09" }
              - { name: sponsor, label: 委託單位, required: false }
              - { name: amount, label: 計畫金額, required: false, hint: "例如：NT$ 300,000" }

      - name: research
        label: 研究方向（顯示在實驗室介紹頁）
        file: src/data/research.json
        fields:
          - name: items
            label: 研究方向
            label_singular: 研究主題
            widget: list
            required: false
            summary: "{{fields.title_zh}}"
            fields:
              - { name: title_zh, label: 名稱（中文） }
              - { name: title_en, label: 名稱（英文）, required: false }
              - { name: summary_zh, label: 說明（中文）, widget: markdown, required: false }
              - { name: summary_en, label: 說明（英文）, widget: markdown, required: false }
              - { name: image, label: 圖片, widget: image, required: false }

  - name: settings
    label: 網站設定
    files:
      - name: site
        label: 基本資料、實驗室介紹、聯絡資訊
        file: src/data/site.json
        fields:
          - { name: name_zh, label: 實驗室名稱（中文） }
          - { name: name_en, label: 實驗室名稱（英文） }
          - { name: short_name, label: 簡稱, default: NRIO Lab }
          - { name: logo, label: LOGO, widget: image, required: false }
          - { name: banner_image, label: 頁面橫幅背景（星空圖）, widget: image, required: false }
          - { name: intro_title_zh, label: 介紹標題（中文）, required: false, default: 研究室簡介 }
          - { name: intro_title_en, label: 介紹標題（英文）, required: false }
          - { name: intro_zh, label: 實驗室介紹（中文）, widget: markdown }
          - { name: intro_en, label: 實驗室介紹（英文）, widget: markdown, required: false }
          - { name: intro_figure, label: 介紹頁圖片（研究程序圖）, widget: image, required: false }
          - { name: intro_figure_caption_zh, label: 圖片說明（中文）, required: false }
          - { name: intro_figure_caption_en, label: 圖片說明（英文）, required: false }
          - { name: description_zh, label: 網站簡介（中文，顯示在 Google 搜尋結果）, widget: text, hint: "約 80–120 字" }
          - { name: description_en, label: 網站簡介（英文）, widget: text, required: false }
          - { name: institution_zh, label: 所屬學校／系所（中文）, required: false }
          - { name: institution_en, label: 所屬學校／系所（英文）, required: false }
          - { name: address_zh, label: 研究室地址（中文）, required: false }
          - { name: address_en, label: 研究室地址（英文）, required: false }
          - { name: email, label: 研究室信箱, required: false }
          - { name: phone, label: 研究室電話, required: false }
          - { name: map_query, label: 地圖搜尋字串（保留欄位）, required: false }
          - { name: google_site_verification, label: Google Search Console 驗證碼, required: false, hint: "只填 content 的值" }
