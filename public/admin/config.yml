# NRIO Lab 後台設定（Sveltia CMS）
# 每次在後台按「儲存」都會 commit 到 GitHub，GitHub Actions 會自動重新建置網站（約 1–2 分鐘）。
backend:
  name: github
  repo: Adakuo616/NRIOLab
  branch: main

# 上傳的圖片存放位置
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: news
    label: 最新消息
    label_singular: 消息
    folder: src/content/news
    extension: md
    format: frontmatter
    create: true
    identifier_field: title_zh
    slug:
      template: "{{year}}-{{month}}-{{day}}-{{fields.title_zh}}"
      editable: [create]
    summary: "{{date}}｜{{title_zh}}"
    sortable_fields: [date, title_zh]
    fields:
      - { name: title_zh, label: 標題（中文） }
      - { name: title_en, label: 標題（英文，可留空）, required: false }
      - { name: date, label: 日期, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: category, label: 分類, widget: select, options: [公告, 活動, 榮譽, 招生, 演講, 其他], default: 公告 }
      - { name: pinned, label: 置頂, widget: boolean, default: false }
      - { name: image, label: 封面圖片, widget: image, required: false }
      - { name: link, label: 外部連結, required: false }
      - { name: body, label: 內容（中文）, widget: markdown, required: false }
      - { name: body_en, label: 內容（英文，可留空）, widget: markdown, required: false }

  - name: content
    label: 網站內容
    files:
      - name: research
        label: 研究方向
        file: src/data/research.json
        fields:
          - name: items
            label: 研究方向
            label_singular: 研究主題
            widget: list
            summary: "{{fields.title_zh}}"
            fields:
              - { name: title_zh, label: 名稱（中文） }
              - { name: title_en, label: 名稱（英文）, required: false }
              - { name: summary_zh, label: 說明（中文）, widget: markdown, required: false }
              - { name: summary_en, label: 說明（英文）, widget: markdown, required: false }
              - { name: image, label: 圖片, widget: image, required: false }

      - name: members
        label: 實驗室成員
        file: src/data/members.json
        fields:
          - name: items
            label: 成員列表
            label_singular: 成員
            widget: list
            summary: "{{fields.name_zh}}（{{fields.role}}）"
            fields:
              - { name: name_zh, label: 姓名（中文） }
              - { name: name_en, label: 姓名（英文）, required: false }
              - name: role
                label: 身分
                widget: select
                default: master
                options:
                  - { label: 主持人, value: pi }
                  - { label: 博士後研究員, value: postdoc }
                  - { label: 博士生, value: phd }
                  - { label: 碩士生, value: master }
                  - { label: 大學部專題生, value: undergrad }
                  - { label: 研究助理, value: assistant }
                  - { label: 畢業校友, value: alumni }
              - { name: title_zh, label: 職稱／年級（中文）, required: false, hint: "例如：碩二、教授" }
              - { name: title_en, label: 職稱／年級（英文）, required: false }
              - { name: year, label: 入學／畢業年度, required: false }
              - { name: research_zh, label: 研究主題（中文）, required: false }
              - { name: research_en, label: 研究主題（英文）, required: false }
              - { name: email, label: Email, required: false }
              - { name: photo, label: 照片, widget: image, required: false }

      - name: publications
        label: 研究成果
        file: src/data/publications.json
        fields:
          - name: items
            label: 著作列表
            label_singular: 著作
            widget: list
            summary: "{{fields.year}}｜{{fields.title}}"
            add_to_top: true
            fields:
              - { name: year, label: 年份, widget: number, value_type: int }
              - name: type
                label: 類型
                widget: select
                default: journal
                options:
                  - { label: 期刊論文, value: journal }
                  - { label: 研討會論文, value: conference }
                  - { label: 專利, value: patent }
                  - { label: 專書／章節, value: book }
                  - { label: 其他, value: other }
              - { name: authors, label: 作者 }
              - { name: title, label: 題目 }
              - { name: venue, label: 期刊／會議名稱, required: false }
              - { name: link, label: 連結（DOI 等）, required: false }

  - name: settings
    label: 網站設定
    files:
      - name: site
        label: 基本資料與實驗室介紹
        file: src/data/site.json
        fields:
          - { name: name_zh, label: 實驗室名稱（中文） }
          - { name: name_en, label: 實驗室名稱（英文） }
          - { name: tagline_zh, label: 首頁標語（中文）, required: false }
          - { name: tagline_en, label: 首頁標語（英文）, required: false }
          - { name: description_zh, label: 網站簡介（中文，Google 搜尋結果顯示）, widget: text, hint: "約 80–120 字，描述實驗室在做什麼" }
          - { name: description_en, label: 網站簡介（英文）, widget: text, required: false }
          - { name: logo, label: LOGO, widget: image, required: false }
          - { name: institution_zh, label: 所屬單位（中文）, required: false, hint: "例如：○○大學○○學系" }
          - { name: institution_en, label: 所屬單位（英文）, required: false }
          - { name: hero_image, label: 首頁橫幅圖片, widget: image, required: false }
          - { name: intro_zh, label: 實驗室介紹（中文）, widget: markdown }
          - { name: intro_en, label: 實驗室介紹（英文）, widget: markdown, required: false }
          - { name: pi_name_zh, label: 主持人姓名（中文）, required: false }
          - { name: pi_name_en, label: 主持人姓名（英文）, required: false }
          - { name: pi_title_zh, label: 主持人職稱（中文）, required: false }
          - { name: pi_title_en, label: 主持人職稱（英文）, required: false }
          - { name: pi_photo, label: 主持人照片, widget: image, required: false }
          - { name: address_zh, label: 地址（中文）, required: false }
          - { name: address_en, label: 地址（英文）, required: false }
          - { name: email, label: 聯絡 Email, required: false }
          - { name: phone, label: 電話, required: false }
          - { name: map_query, label: 地圖搜尋字串, required: false, hint: "填入地址或地點名稱，聯絡頁會顯示 Google 地圖；留空則不顯示" }
          - { name: google_site_verification, label: Google Search Console 驗證碼, required: false, hint: "只填 content 的值" }
